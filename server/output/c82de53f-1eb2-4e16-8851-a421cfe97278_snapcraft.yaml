# snapcraft.yaml — generated by @snap_engineer
name: unknown-soc-gadget
summary: Gadget snap for Unknown SoC
description: |
  Auto-generated Ubuntu Core gadget snap for Unknown SoC (arm64).
  Includes hardware interfaces for selected peripherals.
version: "1.0"
type: gadget
base: core24

architectures:
  - build-on: amd64
    build-for: arm64

build-packages:
  - libc6-dev-arm64-cross
  - gcc-aarch64-linux-gnu
  - device-tree-compiler

parts:
  gadget-files:
    plugin: nil
    source: meta/
    prime:
      - gadget.yaml

  device-tree:
    plugin: dump
    source: src/
    organize:
      "*.dtb": "boot/"
    prime:
      - "boot/*.dtb"

slots:
  serial-uart1:
  gpio-gpio2:
  pwm-pwm2:
  usb-usb:
  usb-usb2:
  ethernet-ethernet:
  camera-camera:
