# fly.toml file generated for pdf-to-gadget via `flyctl launch` command

app = "pdf-to-gadget"

primary_region = "sea"

[build]
  builder = "dockerfile"

[env]
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
